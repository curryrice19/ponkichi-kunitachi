<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ぽん吉AR</title>

  <!-- かいせいデコール（Kaisei Decol）フォントを読み込む -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;700&display=swap" rel="stylesheet">

  <!-- 3DモデルとARを表示する仕組み -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: "Kaisei Decol", serif;
      text-align: center;
      background: #fffaf3;
      color: #333;
    }
    h1 {
      font-size: 1.6em;
      margin: 16px 0 4px;
    }
    model-viewer {
      width: 100%;
      height: 65vh;
    }
    .ar-button {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-family: "Kaisei Decol", serif;
      font-size: 1.1em;
      font-weight: 700;
      padding: 12px 28px;
      border: none;
      border-radius: 30px;
      background: #c0392b;
      color: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }
    .howto {
      max-width: 480px;
      margin: 12px auto 24px;
      padding: 0 16px;
      text-align: left;
      line-height: 1.8;
    }
    .howto h2 {
      font-size: 1.1em;
      margin: 16px 0 4px;
    }
    .howto p {
      margin: 0;
    }
  </style>
</head>
<body>

  <h1>ぽん吉AR</h1>

  <model-viewer src="kunitachi.glb"
    ar ar-modes="webxr scene-viewer quick-look"
    camera-controls auto-rotate>
    <button slot="ar-button" class="ar-button">ARで見る・写真を撮る</button>
  </model-viewer>

  <div class="howto">
    <h2>📱 iPhoneの方</h2>
    <p>「ARで見る」を押して置いたら、画面の白い丸いボタンでそのまま写真が撮れます。</p>

    <h2>📱 Androidの方</h2>
    <p>Androidは画面に撮影ボタンが出ません。置いたあとに<strong>スクリーンショット</strong>で撮ってください。<br>
    （多くの機種は「電源ボタン」と「音量下ボタン」の同時押しです）</p>
  </div>

</body>
</html>
